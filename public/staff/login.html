<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Staff login</title>
<link rel="stylesheet" href="/app/styles.css" />
</head>
<body>
<header><h1>Staff login</h1></header>
<main>
  <div id="error" class="error-banner" style="display:none"></div>
  <div class="card">
    <label for="slug">Restaurant slug</label>
    <input id="slug" placeholder="amani-grill" value="amani-grill" />
    <label for="contact">Phone or email</label>
    <input id="contact" placeholder="kitchen@amani-grill.test" />
    <label for="password">Password</label>
    <input id="password" type="password" value="password123" />
    <button class="primary" id="login-btn">Log in</button>
  </div>
</main>
<script src="/app/api.js"></script>
<script src="/app/staff/login.js"></script>
</body>
</html>
